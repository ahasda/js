<body>
    <script>
        let sum = 0;

        let n = prompt("Enter Your Number");

        n = Number.parseInt(n);

        for(let i=0; i< n; i++){

            sum += (i+1)
        }
        alert("sum of first" + n + "Natural Number is" + sum);
    </script>
